name: CI Suite

on:
  push:
    branches: [ "main", "dev", "fix/*" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  security-audit:
    name: Security & Secret Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Verify No Secrets or Binaries in Git
        run: |
          echo "[*] Checking for forbidden binary files and keystores in git..."
          FORBIDDEN=$(git ls-files '*.keystore' '*.jks' '*.apk' '*.p12')
          if [ -n "$FORBIDDEN" ]; then
            echo "ERROR: Found forbidden files tracked by git:"
            echo "$FORBIDDEN"
            exit 1
          fi
          echo "[✓] No keystores or binary APKs found in repository."

  python-matrix:
    name: Python Unit Tests & Compatibility (${{ matrix.python-version }})
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.9", "3.10", "3.11", "3.12"]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt -r requirements-dev.txt

      - name: Validate IoC Database Integrity
        run: python tools/validate_iocs.py

      - name: Run Pytest Test Suite
        run: pytest -v

      - name: Test Blocklist Exporter
        run: python tools/export_blocklist.py --format all

      - name: Verify Python 3.9+ Compatibility (Vermin)
        run: vermin -t=3.9- --violations tools

  android-build-and-test:
    name: Android TV App Unit Tests & Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission to Gradlew
        run: chmod +x app/gradlew

      - name: Run Android App Unit Tests (JT-01..07)
        run: |
          cd app
          ./gradlew testDebugUnitTest --no-daemon

      - name: Build Debug APK
        run: |
          cd app
          ./gradlew assembleDebug --no-daemon
