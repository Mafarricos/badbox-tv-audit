name: Build APK, Verify Scripts & Release

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-verify:
    name: Verify Python Suite & JSON Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Verify Python Syntax & CLI Help
        run: |
          python -m py_compile tools/audit_security.py tools/setup_env.py tools/tv.py tools/validate_iocs.py tools/export_blocklist.py
          python tools/validate_iocs.py
          python tools/audit_security.py --help

  build-apk:
    name: Build Android TV APK
    needs: lint-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x app/gradlew

      - name: Setup Build Signing Keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_B64" ] || [ -z "$KEYSTORE_PASS" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASS" ]; then
            echo "::error::Segredos de assinatura de release ausentes (ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD, ANDROID_KEY_ALIAS, ANDROID_KEY_PASSWORD). Recusando gerar chave descartavel."
            exit 1
          fi
          mkdir -p ~/.android
          echo "$KEYSTORE_B64" | base64 -d > ~/.android/badbox_release.keystore
          echo "storeFile=$HOME/.android/badbox_release.keystore" > app/keystore.properties
          echo "storePassword=$KEYSTORE_PASS" >> app/keystore.properties
          echo "keyAlias=$KEY_ALIAS" >> app/keystore.properties
          echo "keyPassword=$KEY_PASS" >> app/keystore.properties

      - name: Build Signed Universal Release APK
        run: |
          cd app
          ./gradlew assembleRelease --no-daemon

      - name: Verify Certificate against apk_pin.json and Generate Checksums
        run: |
          mkdir -p release_assets
          APK_SRC="app/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$APK_SRC" ]; then
            echo "::error::APK assinado app-release.apk nao encontrado! Build falhou na assinatura."
            exit 1
          fi
          cp "$APK_SRC" release_assets/xcpe-scanner-tv.apk
          CERT_OUT=$(keytool -printcert -jarfile release_assets/xcpe-scanner-tv.apk)
          echo "$CERT_OUT"
          ACTUAL_FP=$(echo "$CERT_OUT" | grep -oE "SHA256: [0-9A-Fa-f:]+" | awk '{print $2}')
          EXPECTED_FP=$(python3 -c "import json; print(json.load(open('tools/apk_pin.json'))['signing_certificate']['sha256_fingerprint'])")
          echo "Certificado esperado (apk_pin.json): $EXPECTED_FP"
          echo "Certificado obtido no APK:           $ACTUAL_FP"
          if [ "$ACTUAL_FP" != "$EXPECTED_FP" ]; then
            echo "::error::O certificado de assinatura do APK ($ACTUAL_FP) nao corresponde ao pin oficial ($EXPECTED_FP)!"
            exit 1
          fi
          cd release_assets
          sha256sum xcpe-scanner-tv.apk > xcpe-scanner-tv.apk.sha256
          cat xcpe-scanner-tv.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcpe-scanner-tv
          path: release_assets/*

      - name: Publish GitHub Release (on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/xcpe-scanner-tv.apk
            release_assets/xcpe-scanner-tv.apk.sha256
          generate_release_notes: true
