plugins {
    id 'com.android.application'
}

Properties keystoreProps = new Properties()
File keystorePropsFile = rootProject.file("keystore.properties")
if (!keystorePropsFile.exists()) {
    keystorePropsFile = file("../../keystore.properties")
}
if (keystorePropsFile.exists()) {
    keystorePropsFile.withInputStream { keystoreProps.load(it) }
}

def ksPath = System.getenv("ANDROID_KEYSTORE_PATH") ?: keystoreProps.getProperty("storeFile")
def ksPassword = System.getenv("ANDROID_KEYSTORE_PASSWORD") ?: keystoreProps.getProperty("storePassword")
def kAlias = System.getenv("ANDROID_KEY_ALIAS") ?: keystoreProps.getProperty("keyAlias")
def kPassword = System.getenv("ANDROID_KEY_PASSWORD") ?: keystoreProps.getProperty("keyPassword")

boolean hasReleaseSigning = ksPath && file(ksPath).exists() && ksPassword && kAlias && kPassword

android {
    namespace 'com.scanner.tv'
    compileSdk 34

    defaultConfig {
        applicationId "com.scanner.tv"
        minSdk 21
        targetSdk 34
        versionCode 4
        versionName "2.0.3"
    }

    sourceSets {
        main {
            assets.srcDirs = ["$rootDir/../data"]
        }
    }

    signingConfigs {
        if (hasReleaseSigning) {
            release {
                storeFile file(ksPath)
                storePassword ksPassword
                keyAlias kAlias
                keyPassword kPassword
            }
        }
    }

    buildTypes {
        release {
            if (hasReleaseSigning) {
                signingConfig signingConfigs.release
            } else {
                println("[!] AVISO: Assinatura de release não configurada (sem segredos). O APK de release sairá não assinado.")
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
        debug {
            minifyEnabled false
            debuggable true
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.6.1'
    implementation 'androidx.cardview:cardview:1.0.0'

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
