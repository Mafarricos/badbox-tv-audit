name: Build APK, Verify Scripts & Release

on:
  push:
    branches: [ "main", "dev" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  lint-and-verify:
    name: Verify Python Suite & JSON Database
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Validate Python Scripts Syntax
        run: |
          python -m py_compile tools/audit_security.py
          python -m py_compile tools/deep_forensics.py
          python -m py_compile tools/i18n.py
          python -m py_compile tools/setup_env.py

      - name: Validate IoC Database JSON Integrity
        run: |
          python -c "import json; db = json.load(open('tools/iocs_database.json')); assert 'entries' in db; print(f'Validated {len(db[\"entries\"])} IoC entries successfully!')"

  build-apk:
    name: Build Android TV APK
    needs: lint-and-verify
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"
          cache: "gradle"

      - name: Grant Execute Permission for Gradlew
        run: chmod +x app/gradlew

      - name: Build Debug Universal APK
        run: |
          cd app
          ./gradlew assembleDebug --no-daemon

      - name: Verify and Generate Checksums
        run: |
          mkdir -p release_assets
          cp app/app/build/outputs/apk/debug/app-debug.apk release_assets/xcpe-scanner-tv.apk
          cd release_assets
          sha256sum xcpe-scanner-tv.apk > xcpe-scanner-tv.apk.sha256
          cat xcpe-scanner-tv.apk.sha256

      - name: Upload APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: xcpe-scanner-tv
          path: release_assets/*

      - name: Publish GitHub Release (on tags v*)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release_assets/xcpe-scanner-tv.apk
            release_assets/xcpe-scanner-tv.apk.sha256
          generate_release_notes: true
